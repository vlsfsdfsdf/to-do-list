<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To do app</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div>
      <h1 class="main-title">To do list</h1>
    <div class="container">
      
      <div class="todo-app">
        <h2>Daily tasks</h2>
        <div class="row">
            <input type="text" name="" id="input-box" placeholder="Type something">
            <button onclick="addDailyTask()">Add</button>
        </div>
        <ul id="list-container">
        </ul>
      </div>

      <div class="todo-app">
        <h2>Weekly tasks</h2>
        <div class="row">
            <input type="text" name="" id="weekly-input-box" placeholder="Type something">
            <button onclick="addWeeklyTask()">Add</button>
        </div>
        <ul id="weekly-list-container">
        </ul>
      </div>
    </div>
    </div>
    

    <script src="/script.js"></script>
  </body>
</html>
